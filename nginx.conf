server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O TLS é terminado pelo proxy do Coolify (Traefik), que cuida do certificado.
    # Aqui dentro o container fala HTTP puro.

    location / {
        try_files $uri $uri/ =404;
    }

    # Os assets têm nome fixo. Ao trocar uma imagem, renomeie o arquivo,
    # senão o navegador continua servindo a versão antiga por 30 dias.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # O HTML carrega a constante LEAD_ENDPOINT; não pode ficar preso em cache.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;

    access_log off;
}
