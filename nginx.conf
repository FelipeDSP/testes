server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # O TLS é terminado pelo proxy do Coolify (Caddy, neste servidor), que cuida do
    # certificado. Aqui dentro o container fala HTTP puro.
    #
    # A porta 80 abaixo precisa bater com o campo "Ports Exposes" do Coolify.
    # O EXPOSE do Dockerfile NÃO é lido por ele: o padrão do painel é 3000 e,
    # se os dois divergirem, o proxy devolve 502 com o container saudável.

    # Atenção ao repetir os cabeçalhos abaixo em cada location: no nginx, um add_header
    # dentro de um location descarta TODOS os herdados do server. Sem a repetição, o
    # HTML sairia sem os cabeçalhos de segurança.

    location / {
        try_files $uri $uri/ =404;

        # O HTML carrega a constante LEAD_ENDPOINT; não pode ficar preso em cache.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Os assets têm nome fixo. Ao trocar uma imagem, renomeie o arquivo,
    # senão o navegador continua servindo a versão antiga por 30 dias.
    # Sem a diretiva "expires" aqui: ela emitiria um segundo Cache-Control,
    # conflitando com o desta linha.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;

    access_log off;
}
